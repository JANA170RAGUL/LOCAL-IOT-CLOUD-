name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # We define service containers here to allow running integration checks if needed in the future
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root123' }}
          MYSQL_DATABASE: licp_platform
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      influxdb:
        image: influxdb:2.7
        ports:
          - 8086:8086

      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check backend/

      - name: Dependency Security Scanning (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: Run Pytest Suite with Coverage
        run: |
          pytest backend/tests/ -v --cov=app

      - name: Verify Docker Build
        run: |
          docker build -t localiotcloud-backend:latest backend/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Dependency Security Scanning (npm audit)
        working-directory: ./frontend
        run: npm audit || true

      - name: Run Frontend Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
