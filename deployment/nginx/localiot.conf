# =========================================================
# Nginx Reverse Proxy - LocalIoTCloud
# TLS Termination on port 443 & HTTP (80) -> HTTPS Redirect
# =========================================================

server {
    listen 80;
    server_name iot-server localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iot-server localhost;

    ssl_certificate     /etc/nginx/certs/https-server.crt;
    ssl_certificate_key /etc/nginx/certs/https-server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # REST API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket Stream Reverse Proxy
    location /ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static / Frontend fallback (if deployed via Nginx)
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
