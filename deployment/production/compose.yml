services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-localiotcloud}
      MYSQL_USER: ${MYSQL_USER:-localiot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./certificates:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net

  backend:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mqtt-worker:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    command: ["python", "-m", "app.workers.mqtt_worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  telemetry-worker:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    command: ["python", "-m", "app.workers.telemetry_worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  notification-worker:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    command: ["python", "-m", "app.workers.notification_worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  command-worker:
    image: localiotcloud/backend:${LOCAL_IOT_VERSION:-1.0.0}
    command: ["python", "-m", "app.workers.command_worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: localiotcloud/frontend:${LOCAL_IOT_VERSION:-1.0.0}
    restart: unless-stopped
    networks:
      - frontend_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  frontend_net:
  backend_net:
    internal: true

volumes:
  mysql_data:
  redis_data:
  influxdb_data:
  mosquitto_data:
